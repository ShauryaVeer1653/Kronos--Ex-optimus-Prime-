<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhytoScan | AI Plant Diagnostics &amp; Crop Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1a1c1e;
            --text-muted: #6e7480;
            --border-color: #e3e8ee;
            --fill-bg: #eef1f4;
            --accent-primary: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --accent-warn: #f43f5e;
            --radius-card: 28px;
            --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 50px -15px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
        }

        /* ===================== MOBILE (default) ===================== */
        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
        }

        .brand-logo {
            width: 40px; height: 40px;
            background: var(--accent-primary);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-family: 'Sora', sans-serif;
            font-weight: 700; font-size: 1.2rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-text {
            font-family: 'Sora', sans-serif;
            font-weight: 700; font-size: 1.2rem;
            letter-spacing: -0.02em;
        }

        .status-chip {
            display: flex; align-items: center; gap: 0.5rem;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px; height: 7px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .hero {
            padding: 0.5rem 0;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }

        .hero h1 span { color: var(--accent-primary); }

        .hero p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* App card – mobile: single column */
        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scanner-wrapper {
            padding: 1.25rem;
            background: linear-gradient(180deg, #ffffff 0%, #f9fbfc 100%);
        }

        .scanner-box {
            position: relative;
            aspect-ratio: 16/10;
            border: 2px dashed #d1d9e0;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            background: #fcfcfd;
        }

        .scanner-box:hover { border-color: var(--accent-primary); background: #f0fdf4; }
        .scanner-box.dragging { border-color: var(--accent-primary); background: #ecfdf5; transform: scale(1.01); }

        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(16,185,129,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none; z-index: 2; display: none;
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            box-shadow: 0 0 15px var(--accent-primary);
            opacity: 0; z-index: 3;
        }

        .scanner-box.scanning .scan-line { animation: scan 2s ease-in-out infinite; opacity: 1; }

        @keyframes scan {
            0%{top:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{top:100%;opacity:0}
        }

        .upload-prompt { text-align: center; color: var(--text-muted); z-index: 1; padding: 1.5rem; }
        .upload-prompt svg { width: 44px; height: 44px; margin-bottom: 0.75rem; stroke: var(--accent-primary); }
        .upload-prompt h3 { font-family: 'Sora', sans-serif; font-size: 1.15rem; color: var(--text-main); margin-bottom: 0.25rem; }
        .upload-prompt p { font-size: 0.85rem; }

        #preview-image { width: 100%; height: 100%; object-fit: cover; display: none; z-index: 1; }
        #file-input { display: none; }

        .data-panel {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .panel-title { font-family: 'Sora', sans-serif; font-size: 1.15rem; font-weight: 600; }

        .specimen-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: var(--text-muted);
            background: var(--fill-bg);
            padding: 0.4rem 0.8rem;
            border-radius: 100px;
        }

        .log-console {
            display: none; flex-direction: column; gap: 0.75rem;
            padding: 1.25rem;
            background: #fbfcfd;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 1.25rem;
        }

        .log-line {
            display: flex; align-items: center; gap: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; color: var(--text-muted);
            opacity: 0; transform: translateX(-10px);
            animation: slideInLog 0.4s forwards;
        }

        .log-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .log-line.success .dot { background: var(--accent-primary); box-shadow: 0 0 6px var(--accent-glow); }
        .log-line.success { color: var(--text-main); }

        @keyframes slideInLog { to { opacity: 1; transform: translateX(0); } }

        .results-list { display: none; flex-direction: column; gap: 1rem; margin-bottom: 1.25rem; }

        .result-item { opacity: 0; transform: translateY(10px); animation: slideInResult 0.5s forwards; }
        @keyframes slideInResult { to { opacity: 1; transform: translateY(0); } }

        .result-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
        .result-name { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
        .result-confidence { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 600; color: var(--accent-primary); }
        .result-item.danger .result-confidence { color: var(--accent-warn); }

        .progress-track { width: 100%; height: 8px; background-color: var(--fill-bg); border-radius: 100px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent-primary); border-radius: 100px; width: 0%; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
        .result-item.danger .progress-fill { background-color: var(--accent-warn); }

        .treatment-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            display: flex; flex-direction: column; gap: 0.75rem;
        }

        .treatment-section { display: flex; flex-direction: column; gap: 0.25rem; }

        .treatment-title {
            font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .treatment-body { font-size: 0.88rem; line-height: 1.55; color: var(--text-main); }

        .btn {
            width: 100%; padding: 0.9rem;
            border: none; border-radius: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: auto;
        }

        .btn-primary { background-color: var(--accent-primary); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
        .btn-primary:hover { background-color: #0ca672; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background-color: var(--fill-bg); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===================== TABLET (768px+) ===================== */
        @media (min-width: 768px) {
            body { padding: 1.5rem 2rem; }

            .container { max-width: 100%; gap: 1rem; }

            .hero { padding: 0.5rem 0 0; }

            .app-card {
                flex-direction: row;
                border-radius: 24px;
                min-height: 70vh;
            }

            .scanner-wrapper {
                flex: 0 0 45%;
                border-bottom: none;
                border-right: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .scanner-box {
                aspect-ratio: auto;
                flex: 1;
                min-height: 300px;
            }

            .data-panel {
                flex: 1;
                padding: 2rem;
                overflow-y: auto;
                max-height: 70vh;
            }
        }

        /* ===================== DESKTOP (1200px+) ===================== */
        @media (min-width: 1200px) {
            body { padding: 2rem 3rem; }

            .app-card { min-height: 75vh; }

            .scanner-wrapper { flex: 0 0 42%; }

            .scanner-box { min-height: 400px; }

            .data-panel { padding: 2.5rem; }
        }

        /* ===================== LARGE DESKTOP (1600px+) ===================== */
        @media (min-width: 1600px) {
            .container { max-width: 1500px; }
            .app-card { min-height: 80vh; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="/" class="brand">
                <div class="brand-logo">P</div>
                <div class="brand-text">PhytoScan AI</div>
            </a>
            <div class="status-chip">
                <div class="status-dot"></div>
                CNN CORE ACTIVE
            </div>
        </header>

        <div class="hero">
            <h1>Neural <span>Plant</span> Diagnostics</h1>
            <p>Upload a crop leaf specimen to instantly detect pathogens, causes, and treatment protocols.</p>
        </div>

        <div class="app-card">
            <!-- Scanner Area -->
            <div class="scanner-wrapper">
                <div class="scanner-box" id="scanner-box">
                    <div class="scan-line"></div>
                    <div class="scanner-overlay" id="scanner-overlay"></div>

                    <div class="upload-prompt" id="upload-prompt">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                        </svg>
                        <h3>Drop Leaf Image Here</h3>
                        <p>or click to browse (JPG, JPEG, PNG)</p>
                    </div>

                    <img id="preview-image" src="#" alt="Specimen">
                    <input type="file" id="file-input" accept="image/*">
                </div>
            </div>

            <!-- Data Panel -->
            <div class="data-panel">
                <div class="panel-header">
                    <div class="panel-title">Analysis Report</div>
                    <div class="specimen-id" id="specimen-id">AWAITING_INPUT</div>
                </div>

                <div class="log-console" id="log-console"></div>
                <div class="results-list" id="results-list"></div>

                <div class="treatment-card" id="treatment-card" style="display: none;">
                    <div class="treatment-section">
                        <div class="treatment-title" style="color: #2563eb;">🔬 Cause &amp; Description</div>
                        <div class="treatment-body" id="treatment-cause"></div>
                    </div>
                    <div class="treatment-section">
                        <div class="treatment-title" style="color: #10b981;">💊 Recommended Treatment</div>
                        <div class="treatment-body" id="treatment-cure"></div>
                    </div>
                </div>

                <button class="btn btn-primary" id="scan-btn" disabled>INITIATE SCAN</button>
            </div>
        </div>
    </div>

    <script>
        const scannerBox = document.getElementById('scanner-box');
        const fileInput = document.getElementById('file-input');
        const uploadPrompt = document.getElementById('upload-prompt');
        const previewImage = document.getElementById('preview-image');
        const scannerOverlay = document.getElementById('scanner-overlay');
        const scanBtn = document.getElementById('scan-btn');
        const logConsole = document.getElementById('log-console');
        const resultsList = document.getElementById('results-list');
        const treatmentCard = document.getElementById('treatment-card');
        const treatmentCause = document.getElementById('treatment-cause');
        const treatmentCure = document.getElementById('treatment-cure');
        const specimenId = document.getElementById('specimen-id');

        let selectedFile = null;

        scannerBox.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

        ['dragenter','dragover'].forEach(ev => {
            scannerBox.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); scannerBox.classList.add('dragging'); });
        });
        ['dragleave','drop'].forEach(ev => {
            scannerBox.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); scannerBox.classList.remove('dragging'); });
        });
        scannerBox.addEventListener('drop', (e) => { if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]); });
        scanBtn.addEventListener('click', initiateScan);

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    uploadPrompt.style.display = 'none';
                    previewImage.style.display = 'block';
                    scannerOverlay.style.display = 'block';
                    scanBtn.disabled = false;
                    scanBtn.innerText = 'INITIATE SCAN';
                    specimenId.innerText = 'SP-' + Math.random().toString(36).substring(2,8).toUpperCase();
                    logConsole.style.display = 'none';
                    resultsList.style.display = 'none';
                    treatmentCard.style.display = 'none';
                    logConsole.innerHTML = '';
                    resultsList.innerHTML = '';
                };
                reader.readAsDataURL(file);
            } else {
                alert('Please upload a valid image file.');
            }
        }

        async function initiateScan() {
            if (!selectedFile) return;

            scanBtn.disabled = true;
            scanBtn.innerHTML = '<div class="spinner"></div> ANALYZING...';
            scannerBox.classList.add('scanning');

            logConsole.style.display = 'flex';
            resultsList.style.display = 'none';
            treatmentCard.style.display = 'none';
            logConsole.innerHTML = '';

            // Remove any previously added extra treatment cards
            document.querySelectorAll('.extra-treatment').forEach(el => el.remove());

            const steps = [
                { text: "Initializing neural network...", delay: 0 },
                { text: "Extracting 2D convolutional features...", delay: 400 },
                { text: "Evaluating chlorophyll & necrosis patterns...", delay: 800 },
                { text: "Cross-referencing 38-pathogen disease catalog...", delay: 1200 }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    line.innerHTML = `<div class="dot"></div>${step.text}`;
                    logConsole.appendChild(line);
                    logConsole.scrollTop = logConsole.scrollHeight;
                    const prevLine = logConsole.children[logConsole.children.length - 2];
                    if (prevLine) prevLine.classList.add('success');
                }, step.delay);
            });

            const formData = new FormData();
            formData.append('img', selectedFile);

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                setTimeout(() => {
                    if (logConsole.lastChild) logConsole.lastChild.classList.add('success');
                    scannerBox.classList.remove('scanning');

                    if (data.status === 'success' && data.prediction) {
                        displayResults(data.prediction);
                    } else {
                        alert(data.message || 'Unable to identify a plant in this image.');
                    }
                    scanBtn.disabled = false;
                    scanBtn.innerText = 'RESCAN SPECIMEN';
                }, 1600);
            } catch (err) {
                setTimeout(() => {
                    scannerBox.classList.remove('scanning');
                    scanBtn.disabled = false;
                    scanBtn.innerText = 'RESCAN SPECIMEN';
                    alert('Error: ' + err.message);
                }, 1600);
            }
        }

        function displayResults(prediction) {
            logConsole.style.display = 'none';
            resultsList.style.display = 'flex';
            resultsList.innerHTML = '';

            // Remove any previously added extra treatment cards
            document.querySelectorAll('.extra-treatment').forEach(el => el.remove());

            const isHealthy = (prediction.name || '').toLowerCase().includes('healthy');
            const isDanger = !isHealthy && !(prediction.name || '').toLowerCase().includes('background');
            const confVal = parseFloat(prediction.confidence_score || prediction.confidence) || 95.0;

            const sourceText = prediction.corrected_by === 'gemini'
                ? '🤖 Gemini corrected CNN prediction'
                : (prediction.source || '').includes('gemini') ? '🤖 Gemini Vision' : '🧠 Local CNN';

            // Primary result
            const item = document.createElement('div');
            item.className = `result-item ${isDanger ? 'danger' : ''}`;
            item.innerHTML = `
                <div class="result-row">
                    <span class="result-name">${prediction.name || 'Unknown'}</span>
                    <span class="result-confidence">${confVal.toFixed(2)}%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
                <div style="font-size:0.72rem;color:var(--text-muted);margin-top:0.3rem;font-family:'JetBrains Mono',monospace;">${sourceText}</div>
            `;
            resultsList.appendChild(item);

            setTimeout(() => {
                item.querySelector('.progress-fill').style.width = `${Math.min(confVal, 100)}%`;
            }, 100);

            // Gemini cross-check comparison
            if (prediction.gemini_prediction && prediction.corrected_by !== 'gemini') {
                const gp = prediction.gemini_prediction;
                const gpConf = parseFloat(gp.confidence_score) || 0;
                const agree = (prediction.crop || '').toLowerCase() === (gp.crop || '').toLowerCase();
                const badge = agree
                    ? '<span style="color:#10b981;font-weight:600;">✓ Agree</span>'
                    : '<span style="color:#f43f5e;font-weight:600;">✗ Mismatch</span>';
                const gemItem = document.createElement('div');
                gemItem.className = 'result-item';
                gemItem.style.animationDelay = '0.15s';
                gemItem.innerHTML = `
                    <div class="result-row">
                        <span class="result-name" style="font-size:0.85rem;">${gp.name || 'N/A'} ${badge}</span>
                        <span class="result-confidence" style="font-size:0.78rem;">${gpConf.toFixed(1)}%</span>
                    </div>
                    <div class="progress-track" style="height:5px;">
                        <div class="progress-fill" style="width:0%;background:#94a3b8;"></div>
                    </div>
                    <div style="font-size:0.68rem;color:var(--text-muted);margin-top:0.2rem;">🤖 Gemini verification</div>
                `;
                resultsList.appendChild(gemItem);
                setTimeout(() => {
                    gemItem.querySelector('.progress-fill').style.width = `${Math.min(gpConf, 100)}%`;
                }, 250);
            }

            // Treatment & Cause
            if (prediction.cause || prediction.cure) {
                treatmentCause.innerHTML = formatText(prediction.cause || 'No cause information available.');
                treatmentCure.innerHTML = formatText(prediction.cure || 'No treatment details available.');
                treatmentCard.style.display = 'flex';
            }

            // Organic / Chemical / Biological
            const treatment = prediction.treatment || {};
            if (treatment.organic || treatment.chemical || treatment.biological) {
                const extraCard = document.createElement('div');
                extraCard.className = 'treatment-card extra-treatment';
                extraCard.style.display = 'flex';
                extraCard.innerHTML = `
                    <div class="treatment-section">
                        <div class="treatment-title" style="color:#16a34a;">🌿 Organic Treatment</div>
                        <div class="treatment-body">${formatText(treatment.organic || 'N/A')}</div>
                    </div>
                    <div class="treatment-section">
                        <div class="treatment-title" style="color:#dc2626;">⚗️ Chemical Treatment</div>
                        <div class="treatment-body">${formatText(treatment.chemical || 'N/A')}</div>
                    </div>
                    <div class="treatment-section">
                        <div class="treatment-title" style="color:#7c3aed;">🦠 Biological Control</div>
                        <div class="treatment-body">${formatText(treatment.biological || 'N/A')}</div>
                    </div>
                `;
                treatmentCard.parentElement.insertBefore(extraCard, treatmentCard.nextSibling);
            }

            // Prevention
            if (prediction.prevention) {
                const prevCard = document.createElement('div');
                prevCard.className = 'treatment-card extra-treatment';
                prevCard.style.display = 'flex';
                prevCard.innerHTML = `
                    <div class="treatment-section">
                        <div class="treatment-title" style="color:#2563eb;">🛡️ Prevention Tips</div>
                        <div class="treatment-body">${formatText(prediction.prevention)}</div>
                    </div>
                `;
                treatmentCard.parentElement.insertBefore(prevCard, treatmentCard.nextSibling);
            }
        }

        function formatText(text) {
            if (!text) return '';
            return text.replace(/\.(\s+)/g, '.<br><br>').replace(/;\s+/g, ';<br>');
        }
    </script>
</body>
</html>
